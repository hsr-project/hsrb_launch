controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    head_trajectory_controller:
      type: tmc_joint_command_controller/BasicJointCommandController
    arm_trajectory_controller:
      type: tmc_joint_command_controller/BasicJointCommandController
    gripper_controller:
      type: hsrb_gripper_controller/HrhGripperController
    omni_base_controller:
      type: hsrb_base_controllers/OmniBaseController

head_trajectory_controller:
  ros__parameters:
    joints:
      - head_tilt_joint
      - head_pan_joint
    state_interfaces:
      - position
    open_loop_control: true
    use_velocity_state_for_trajectory: false

arm_trajectory_controller:
  ros__parameters:
    joints:
      - arm_lift_joint
      - arm_flex_joint
      - arm_roll_joint
      - wrist_flex_joint
      - wrist_roll_joint
    state_interfaces:
      - position
    open_loop_control: true
    use_velocity_state_for_trajectory: false

gripper_controller:
  ros__parameters:
    joints:
      - hand_motor_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    force_calib_data_path: /etc/opt/tmc/robot/conf.d/calib_results/hand_force_params.yaml
    position_goal_tolerance: 0.2
    left_spring_joint: hand_l_spring_proximal_joint
    right_spring_joint: hand_r_spring_proximal_joint
    open_loop_control: true
    do_output_position_control: true
    distance_control_pgain: 2.0
    distance_control_igain: 0.5
    distance_control_dgain: 2.5
    distance_goal_tolerance: 0.003
    force_goal_tolerance: 10000.0
    force_control_pgain: 0.3
    force_control_igain: 0.05
    force_control_dgain: 0.4

omni_base_controller:
  ros__parameters:
    use_base_roll_velocity: true
    joints:
      l_wheel: base_l_drive_wheel_joint
      r_wheel: base_r_drive_wheel_joint
      steer: base_roll_joint
    wheel_odom_map_frame: odom
    wheel_odom_base_frame: base_footprint_wheel
    odometry_publish_rate: 50.0
    transform_publish_rate: 50.0
    yaw_velocity_limit: 1.8
    wheel_velocity_limit: 20.0
    base_coordinates: [odom_x, odom_y, odom_t]
    odom_x: {p_gain: 1.0}
    odom_y: {p_gain: 1.0}
    odom_t: {p_gain: 1.0}
    constraints:
      stopped_velocity_tolerance: 0.0
      odom_x: {trajectory: 0.05}
      odom_y: {trajectory: 0.05}
      odom_t: {trajectory: 0.1}

